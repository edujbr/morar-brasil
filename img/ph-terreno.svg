<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#e7d7bc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#sky)"/>
  <ellipse cx="180" cy="180" rx="160" ry="90" fill="#fffaf3" filter="url(#soft)"/>
  <path d="M0 470 C200 390 320 520 520 450 C680 400 740 480 800 440 V800 H0 Z" fill="#e4d2ae"/>
  <path d="M0 600 C220 520 360 680 560 590 C700 530 760 620 800 580 V800 H0 Z" fill="#d2bc93"/>
  <path d="M40 500 H760" stroke="#c2a67a" stroke-width="4" opacity=".7"/>
  <rect width="800" height="800" filter="url(#grain)" opacity=".45"/>
</svg>
