<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#d5dbe6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect x="40" y="-20" width="250" height="860" fill="#c9d0de"/>
  <g fill="#b7c0d4">
    <rect x="340" y="40" width="150" height="180"/>
    <rect x="520" y="40" width="150" height="180"/>
    <rect x="340" y="250" width="150" height="180"/>
    <rect x="520" y="250" width="150" height="180"/>
    <rect x="340" y="460" width="150" height="180"/>
    <rect x="520" y="460" width="150" height="180"/>
    <rect x="340" y="670" width="150" height="180"/>
    <rect x="520" y="670" width="150" height="180"/>
  </g>
  <rect x="360" y="270" width="110" height="140" fill="#f7f8fb" opacity=".55"/>
  <rect x="540" y="480" width="110" height="140" fill="#9aa6bf" opacity=".45"/>
  <rect width="800" height="800" filter="url(#grain)" opacity=".4"/>
</svg>
