<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6ee"/>
      <stop offset="1" stop-color="#d5e3c4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <ellipse cx="140" cy="520" rx="180" ry="90" fill="#8fa872" filter="url(#soft)"/>
  <ellipse cx="640" cy="180" rx="150" ry="80" fill="#fffaf2" filter="url(#soft)"/>
  <path d="M0 430 C180 360 300 500 480 420 C640 350 720 470 800 400 V800 H0 Z" fill="#c9daae"/>
  <rect x="470" y="360" width="250" height="150" fill="#f7f8f2"/>
  <path d="M450 370 L595 270 L740 370" fill="#fbfcf8"/>
  <rect x="575" y="400" width="48" height="110" fill="#7d9870"/>
  <rect width="800" height="800" filter="url(#grain)" opacity=".35"/>
</svg>
