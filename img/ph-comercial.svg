<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f3f1"/>
      <stop offset="1" stop-color="#e2e0dc"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#g)"/>
  <rect x="-20" y="80" width="840" height="250" fill="#d5dde3"/>
  <rect x="40" y="360" width="230" height="360" fill="#eceae6"/>
  <rect x="285" y="360" width="230" height="360" fill="#d9dee2"/>
  <rect x="530" y="360" width="230" height="360" fill="#eceae6"/>
  <rect x="80" y="120" width="640" height="160" fill="#f7f8f8" opacity=".45"/>
  <rect y="730" width="800" height="70" fill="#d8d4ce"/>
  <rect width="800" height="800" filter="url(#grain)" opacity=".35"/>
</svg>
