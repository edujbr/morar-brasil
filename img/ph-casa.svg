<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe6"/>
      <stop offset="1" stop-color="#d5e0d8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#sky)"/>
  <ellipse cx="620" cy="90" rx="180" ry="120" fill="#fffaf2" filter="url(#soft)"/>
  <rect x="-40" y="250" width="880" height="620" fill="#e7efe9"/>
  <rect x="60" y="210" width="760" height="640" fill="#f7f8f4"/>
  <rect x="150" y="300" width="230" height="280" fill="#9aafa3"/>
  <rect x="168" y="318" width="194" height="244" fill="#d5e2da"/>
  <rect x="430" y="360" width="250" height="200" fill="#c5d5cc"/>
  <rect x="250" y="620" width="160" height="220" fill="#6d8b7c"/>
  <rect y="700" width="800" height="100" fill="#c9d6ce"/>
  <rect width="800" height="800" filter="url(#grain)" opacity=".35"/>
</svg>
