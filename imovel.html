<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c7a52">
  <title>Imóvel — Imóvel Seguro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="index.html"><span class="brand-mark">🛡</span> Imóvel <span>Seguro</span> <em class="temp">nome temp.</em></a>
      <nav class="nav">
        <a href="index.html" data-nav="index.html">Imóveis</a>
        <a href="anti-golpe.html">Proteção</a>
        <span id="auth-slot"></span>
        <a class="btn btn-terra btn-sm" href="anunciar.html">Anunciar</a>
      </nav>
    </div>
  </header>
  <main class="wrap" style="padding-top:18px"><div id="detail"></div></main>
  <div class="modal-bg" id="report-modal" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>🚩 Denunciar anúncio</h3>
      <p class="help" id="report-listing-title"></p>
      <form id="report-form" class="form-grid" style="margin-top:12px">
        <label class="field">Motivo
          <select name="reason" required>
            <option value="">Selecione…</option>
            <option>Suspeita de golpe</option>
            <option>Fotos ou dados falsos</option>
            <option>Pediu Pix sem visita</option>
            <option>Endereço errado / imóvel inexistente</option>
            <option>Outro</option>
          </select>
        </label>
        <label class="field">Detalhes (opcional)<textarea name="details" rows="3"></textarea></label>
        <label class="field">Seu contato (opcional)<input name="contact" type="text"></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="submit" class="btn btn-danger" id="report-submit">Enviar denúncia</button>
          <button type="button" class="btn btn-ghost" id="report-cancel">Cancelar</button>
        </div>
        <div class="ok-box" id="report-ok"></div>
      </form>
    </div>
  </div>
  <footer class="footer"><div class="wrap footer-grid">
    <div><strong>Imóvel Seguro</strong></div>
    <div><a href="anti-golpe.html">Proteção</a> · <a href="privacidade.html">LGPD</a></div>
  </div></footer>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
