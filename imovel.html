<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f6b4c">
  <title>Imóvel — Imóvel Seguro</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="index.html"><span class="brand-mark">🛡</span> Imóvel <span>Seguro</span> <em class="temp">nome temp.</em></a>
      <nav class="nav">
        <a href="index.html" data-nav="index.html">Imóveis</a>
        <a href="anti-golpe.html" data-nav="anti-golpe.html">Anti-golpe</a>
        <a href="contrato.html" data-nav="contrato.html">Contrato</a>
        <a href="precos.html" data-nav="precos.html">Planos</a>
        <a class="btn btn-terra" href="anunciar.html" style="padding:8px 14px;font-size:13px">Anunciar grátis</a>
      </nav>
    </div>
  </header>

  <main class="wrap" style="padding-top:18px">
    <div id="detail"></div>
  </main>

  <div class="modal-bg" id="report-modal" role="dialog" aria-modal="true">
    <div class="modal">
      <h3>🚩 Denunciar anúncio</h3>
      <p class="help" id="report-listing-title"></p>
      <form id="report-form" class="form-grid" style="margin-top:12px">
        <label class="field">Motivo
          <select name="reason" required>
            <option value="">Selecione…</option>
            <option>Suspeita de golpe / preço absurdo</option>
            <option>Fotos ou dados falsos</option>
            <option>Anunciante pediu Pix sem visita</option>
            <option>Imóvel inexistente / endereço errado</option>
            <option>Outro</option>
          </select>
        </label>
        <label class="field">Detalhes (opcional)
          <textarea name="details" rows="3" placeholder="Conte o que aconteceu…"></textarea>
        </label>
        <label class="field">Seu contato (opcional)
          <input name="contact" type="text" placeholder="WhatsApp ou e-mail">
        </label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="submit" class="btn btn-danger" id="report-submit">Enviar denúncia</button>
          <button type="button" class="btn btn-ghost" id="report-cancel">Cancelar</button>
        </div>
        <div class="ok-box" id="report-ok"></div>
        <div class="err-box" id="report-err"></div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="wrap footer-grid">
      <div><strong>Imóvel Seguro</strong> <span style="font-size:11px">(nome temp.)</span></div>
      <div><a href="anti-golpe.html">Anti-golpe</a> · <a href="index.html">Voltar</a></div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
